<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <form action="#" method="post">
        <h1>Compaoré Boukaré</h1>
        <h2>Nous contacter</h2>
        <div class="for-group">
            <label for="nom">Nom complet</label>
            <input type="text" id="nom" name="nom" placeholder="Jean Dupont">
        </div>
        <div class="for-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="jean@Dupont99gmail.com">
        </div>
        <div class="for-group">
            <label for="message">Message</label>
            <textarea name="message" id="message" rows="4"></textarea>
        </div>
        <button type="submit">Submite</button>
    </form>
    <div class="container">
        <div class="box">
            <img src="ia.png" alt="ia image">
            <div class="right">
                <div class="text-1">Subscribe</div>
                <div class="text-2">Subscribe à Compaoré Boukaré</div>
                <a href="#">Subscribe</a>
            </div>
        </div>
    </div>
</body>
</html>
