<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <form action="#" method="post">
        <h2>Nous contacter</h2>
        <label for="nom">Nom Complet</label>

        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="Jean@dupont93@gmail.com">
        <label for="message">Laisser un message</label>
        <textarea id="message" rows="4" name="message" placeholder="Ecrivez votre message ici..."></textarea>
    </form>
    <div class="container">
        <div class="box">
            <img src="ia.png" alt="ia image">
            <div class="right">
                <div class="text-1">Subscribe</div>
                <div class="text-2">Subscribe to our channel</div>
                <a href="#">Subscribe</a>
            </div>
            
        </div>
        
    </div>
</body>
</html>
